<!DOCTYPE html>
<html lang="en" class="h-full bg-ink-bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121214">
  <title>Dlog login</title>
  <link rel="stylesheet" href="/viewer.css">
</head>
<body class="flex min-h-dvh items-center justify-center bg-ink-bg p-4 font-sans text-slate-200 antialiased" data-title="Sign in">
  <form class="w-full max-w-sm rounded-md border border-ink-line bg-ink-chrome px-6 py-6" method="post" action="/api/v1/login">
    <div class="flex items-center gap-2.5">
      <svg class="h-3.5 w-3.5 text-amber-500" viewBox="0 0 14 14" aria-hidden="true">
        <rect x="1" y="1" width="12" height="2" fill="currentColor"/>
        <rect x="1" y="6" width="8" height="2" fill="currentColor"/>
        <rect x="1" y="11" width="10" height="2" fill="currentColor"/>
      </svg>
      <span class="text-[15px] font-semibold tracking-tight text-slate-100" data-brand>Dlog</span>
    </div>
    <p id="login-tagline" class="mt-3 text-[13px] leading-relaxed text-slate-400" data-tagline>Operator console. Agents register with the shared certificate.</p>
    <label class="mb-1.5 mt-6 block text-[11px] font-medium uppercase tracking-[0.14em] text-slate-400" for="username">Username</label>
    <input id="username" name="username" class="h-8 w-full cursor-text rounded-md border border-ink-edge bg-ink-field px-2.5 text-[13px] text-slate-200 transition-colors duration-150 ease-in-out placeholder:text-slate-500 hover:border-slate-500 focus:border-amber-500/70 focus:outline-none" type="text" autocomplete="username" required autofocus>
    <label class="mb-1.5 mt-4 block text-[11px] font-medium uppercase tracking-[0.14em] text-slate-400" for="password">Password</label>
    <input id="password" name="password" class="h-8 w-full cursor-text rounded-md border border-ink-edge bg-ink-field px-2.5 text-[13px] text-slate-200 transition-colors duration-150 ease-in-out placeholder:text-slate-500 hover:border-slate-500 focus:border-amber-500/70 focus:outline-none" type="password" autocomplete="current-password" required>
    <button type="submit" class="mt-5 inline-flex h-8 w-full cursor-pointer items-center justify-center rounded-md border border-amber-500 bg-amber-500 text-[12px] font-medium text-[#1c1408] transition-colors duration-150 ease-in-out hover:bg-amber-400">Sign in</button>
    <p id="login-error" class="mt-4 text-[13px] text-clay" hidden>Wrong username or password.</p>
  </form>
  <script src="/app.js"></script>
</body>
</html>
