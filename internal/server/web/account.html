<!DOCTYPE html>
<html lang="en" class="h-full bg-ink-bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121214">
  <title>Account · Dlog</title>
  <link rel="stylesheet" href="/viewer.css">
</head>
<body class="min-h-dvh bg-ink-bg font-sans text-slate-200 antialiased" data-title="Account">
  <header class="sticky top-0 z-20 flex flex-wrap items-center gap-x-3 gap-y-2 border-b border-ink-line bg-ink-chrome px-4 py-3">
    <a class="flex items-center gap-2.5 text-[15px] font-semibold tracking-tight text-slate-100" href="/">
      <svg class="h-3.5 w-3.5 text-amber-500" viewBox="0 0 14 14" aria-hidden="true">
        <rect x="1" y="1" width="12" height="2" fill="currentColor"/>
        <rect x="1" y="6" width="8" height="2" fill="currentColor"/>
        <rect x="1" y="11" width="10" height="2" fill="currentColor"/>
      </svg>
      <span data-brand>Dlog</span>
    </a>
    <span class="h-4 w-px bg-ink-line" aria-hidden="true"></span>
    <span class="text-[11px] font-medium uppercase tracking-[0.16em] text-slate-400">Account</span>
    <div class="ml-auto flex flex-wrap items-center gap-1.5">
      <a class="cursor-pointer rounded-md px-2.5 py-1.5 text-[13px] text-slate-400 transition-colors duration-150 ease-in-out hover:bg-white/[0.04] hover:text-slate-100" href="/">Logs</a>
      <a id="admin-link" class="cursor-pointer rounded-md px-2.5 py-1.5 text-[13px] text-slate-400 transition-colors duration-150 ease-in-out hover:bg-white/[0.04] hover:text-slate-100" href="/admin" hidden>Admin</a>
      <a id="settings-link" class="cursor-pointer rounded-md px-2.5 py-1.5 text-[13px] text-slate-400 transition-colors duration-150 ease-in-out hover:bg-white/[0.04] hover:text-slate-100" href="/admin#general" hidden>Settings</a>
      <button type="button" id="logout" class="cursor-pointer rounded-md px-2.5 py-1.5 text-[13px] text-slate-500 transition-colors duration-150 ease-in-out hover:bg-white/[0.04] hover:text-slate-200">Log out</button>
    </div>
  </header>
  <main class="mx-auto w-full max-w-lg px-4 py-8">
    <h1 class="text-lg font-semibold tracking-tight text-slate-100">Account</h1>
    <p id="account-summary" class="mt-2 text-[13px] text-slate-400">Signed in</p>
    <p id="account-directory" class="mt-3 text-[13px] leading-relaxed text-slate-400" hidden>The password for this account is the directory password.</p>
    <form id="change-password" class="mt-6 rounded-md border border-ink-line bg-ink-chrome px-5 py-5">
      <h2 class="text-[15px] font-semibold text-slate-100">Change password</h2>
      <p class="mt-2 text-[13px] leading-relaxed text-slate-400">A password is 8 to 72 characters. This replaces the password for your username. This browser stays signed in. Check the box to sign every other session out.</p>
      <label class="mb-1.5 mt-5 block text-[11px] font-medium uppercase tracking-[0.14em] text-slate-400" for="current-password">Current password</label>
      <input id="current-password" class="h-8 w-full cursor-text rounded-md border border-ink-edge bg-ink-field px-2.5 text-[13px] text-slate-200 transition-colors duration-150 ease-in-out hover:border-slate-500 focus:border-amber-500/70 focus:outline-none" name="current_password" type="password" autocomplete="current-password" required>
      <label class="mb-1.5 mt-4 block text-[11px] font-medium uppercase tracking-[0.14em] text-slate-400" for="new-password">New password</label>
      <input id="new-password" class="h-8 w-full cursor-text rounded-md border border-ink-edge bg-ink-field px-2.5 text-[13px] text-slate-200 transition-colors duration-150 ease-in-out hover:border-slate-500 focus:border-amber-500/70 focus:outline-none" name="password" type="password" autocomplete="new-password" required>
      <label class="mb-1.5 mt-4 block text-[11px] font-medium uppercase tracking-[0.14em] text-slate-400" for="confirm-password">Confirm new password</label>
      <input id="confirm-password" class="h-8 w-full cursor-text rounded-md border border-ink-edge bg-ink-field px-2.5 text-[13px] text-slate-200 transition-colors duration-150 ease-in-out hover:border-slate-500 focus:border-amber-500/70 focus:outline-none" name="confirm_password" type="password" autocomplete="new-password" required>
      <label class="mt-4 flex cursor-pointer items-center gap-2 text-[13px] text-slate-200" for="sign-out-others">
        <input id="sign-out-others" class="h-3.5 w-3.5 cursor-pointer" type="checkbox" name="sign_out_others">
        Sign out other sessions
      </label>
      <button type="submit" class="mt-5 inline-flex h-8 cursor-pointer items-center rounded-md border border-amber-500 bg-amber-500 px-3 text-[12px] font-medium text-[#1c1408] transition-colors duration-150 ease-in-out hover:bg-amber-400">Change password</button>
    </form>
  </main>
  <div class="pointer-events-none fixed bottom-5 left-1/2 z-50 -translate-x-1/2">
    <div id="toast" class="pointer-events-auto rounded-md border border-ink-edge bg-ink-chrome px-4 py-2.5 text-[13px] text-slate-200" role="status" aria-live="polite" hidden>
      <div id="toast-body"></div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
