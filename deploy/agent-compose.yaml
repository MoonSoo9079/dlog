# Agent only, for a Docker host that should ship logs to an existing server.
# From the repo root:
#   DLOG_SERVER_URL=https://logs.example.com \
#   DLOG_HOSTNAME=web-01 \
#   DLOG_PSK_ID="$(cat psk.id)" \
#   DLOG_PSK_KEY="$(cat psk.key)" \
#   docker compose -f deploy/agent-compose.yaml up -d --build
# DLOG_PSK_ID and DLOG_PSK_KEY are the id and the key, the same values on
# every agent. When the server generates a key it writes those values to
# psk.id and psk.key in its data directory.
# Every DLOG_* variable the agent reads is listed below. Defaults match the process.
# DLOG_STATE_DIR stays on the state volume.
# DLOG_HOSTNAME_FILE is read only when DLOG_HOSTNAME is empty. This file still
# requires DLOG_HOSTNAME, because a recreated container gets a new hostname.
# With https, TLS encrypts the connection. The agent does not check the
# server certificate. The shared key authenticates the agent.
# For Podman, mount its API socket on /var/run/docker.sock, or set DLOG_DOCKER_HOST
# to the socket path inside the container and mount that socket there.
services:
  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: agent
    image: dlog-agent:local
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dlog-agent:/var/lib/dlog-agent
    environment:
      DLOG_SERVER_URL: ${DLOG_SERVER_URL:?set DLOG_SERVER_URL}
      DLOG_PSK_ID: ${DLOG_PSK_ID:?set DLOG_PSK_ID}
      DLOG_PSK_KEY: ${DLOG_PSK_KEY:?set DLOG_PSK_KEY}
      DLOG_HOSTNAME: ${DLOG_HOSTNAME:?set DLOG_HOSTNAME}
      DLOG_HOSTNAME_FILE: ${DLOG_HOSTNAME_FILE:-}
      DLOG_STATE_DIR: /var/lib/dlog-agent
      DLOG_DOCKER_HOST: ${DLOG_DOCKER_HOST:-/var/run/docker.sock}
      DLOG_SINCE: ${DLOG_SINCE:-10m}
      DLOG_BATCH: ${DLOG_BATCH:-200}
      DLOG_FLUSH: ${DLOG_FLUSH:-1s}
      DLOG_HEARTBEAT: ${DLOG_HEARTBEAT:-15s}
      DLOG_BUFFER: ${DLOG_BUFFER:-10000}
      DLOG_INCLUDE_SELF: ${DLOG_INCLUDE_SELF:-false}
      DLOG_EXCLUDE: ${DLOG_EXCLUDE:-}
      DLOG_LOG_LEVEL: ${DLOG_LOG_LEVEL:-info}
    labels:
      dlog.exclude: "true"

volumes:
  dlog-agent:
